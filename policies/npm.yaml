version: "1"
name: "npm"
description: >
  Extends the default deny-all policy to allow the agent to install Node.js
  packages via npm/pnpm/yarn. Enable with: silo policy apply npm

default: deny

rules:
  # ── Inherited from default ────────────────────────────────────────────────
  - host: "llm.gateway"
    action: allow
    comment: "SILO inference proxy"

  # ── npm registry ─────────────────────────────────────────────────────────
  - host: "registry.npmjs.org"
    action: allow
    comment: "npm package registry"

  - host: "*.npmjs.org"
    action: allow
    comment: "npm CDN"

  # ── Yarn / pnpm alternative registries ────────────────────────────────────
  # Uncomment if using Yarn Berry or pnpm mirror
  # - host: "registry.yarnpkg.com"
  #   action: allow
